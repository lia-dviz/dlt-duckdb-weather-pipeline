name: Modern ELT Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: dlt[duckdb] dbt-duckdb requests pandas

      - name: Run dlt Ingestion Pipeline
        run: python pipeline_dlt.py

      - name: Run dbt Transformations
        run: |
          cd transform_project
          dbt deps --profiles-dir .
          dbt run --profiles-dir .

      - name: Run dbt Data Quality Tests
        run: |
          cd transform_project
          dbt test --profiles-dir .
